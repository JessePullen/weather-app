<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="header">
        <form>
            <div class="search-bar">
                <input class="search-input" type="text" placeholder="Enter a city">
                <button class="search-button">
                    <img src="582e6fdae2c59f4e7b41.svg">
                </button>
            </div>
        </form>
    </div>
    <div class="content">
        <div class="information">
            <h1 class="city-title weather-info">City</h1>
            <div class="information-content">
                <div class="conditions-card">
                    <p class="conditions weather-info">Conditions</p>
                    <div class="weather-image"></div>
                </div>
                <div class="temperature-controls">
                    <label for="temperature-units" class="temperature-label">°F</label>
                    <input class="checkbox temperature-units" name="temperature-units" id="toggle" type="checkbox"
                        checked>
                    <label for="toggle" class="switch"></label>
                    <label for="temprature-units" class="temperature-label">°C</label>
                </div>
                <div class="weather-card">
                    <img class="weather-icon" src="f97640bc2a287f45d6f1.svg">
                    <p class="weather-info temperature"></p>
                    <p>Temperature</p>
                </div>
                <div class="weather-card">
                    <img class="weather-icon" src="df9778f9f4f73db2f832.svg">
                    <p class="weather-info"></p>
                    <p>Precipitation</p>
                </div>
                <div class="weather-card">
                    <img class="weather-icon" src="badeec2c514d50997d00.svg">
                    <p class="weather-info"></p>
                    <p>Humidity</p>
                </div>
                <div class="weather-card">
                    <img class="weather-icon" src="f2016eaa6014d22614a8.svg">
                    <p class="weather-info"></p>
                    <p>Wind Speed</p>
                </div>
            </div>
        </div>
    </div>
<script defer src="main.js"></script></body>
</html>
